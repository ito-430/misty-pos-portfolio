name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # 本番の実行環境は Windows ノートPC なので、Linux だけでなく Windows でもテストする
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
      - name: Failover drill (real processes over HTTP)
        run: python scripts/failover_drill.py
      - name: Sync benchmark
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python scripts/bench_sync.py 3000
