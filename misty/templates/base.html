<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181c">
<title>{% block title %}Misty POS{% endblock %}</title>
<link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{# 画面ごとのスクリプトも defer にして、common.js（Misty 名前空間）より後に実行されることを保証する #}
<script src="{{ url_for('static', filename='js/common.js') }}" defer></script>
{% block head %}{% endblock %}
</head>
<body>
<div class="topbar">
  <div class="brand">Misty POS</div>
  <nav>
    <a href="/register" class="{{ 'active' if active=='register' }}">レジ</a>
    <a href="/bartender" class="{{ 'active' if active=='bartender' }}">バーテン</a>
    <a href="/admin" class="{{ 'active' if active=='admin' }}">管理</a>
  </nav>
  <span class="role-badge {{ 'standby' if not state.is_active }}" id="role-badge">
    {{ state.device_name }} ・ {{ 'ホスト' if state.is_active else 'スタンバイ' }}
  </span>
</div>
<div class="container">
<div class="banner crit" id="cluster-banner" role="alert"></div>
{% block content %}{% endblock %}
</div>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/service-worker.js").catch(() => {});
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
